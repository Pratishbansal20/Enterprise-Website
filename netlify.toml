# Netlify build + hosting settings for the Cee Bee Enterprises (CB Decor) website

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old React-site URLs → their new equivalents (keeps any links/rankings).
[[redirects]]
  from = "/catalogue"
  to = "/products/"
  status = 301

[[redirects]]
  from = "/catalogue/*"
  to = "/products/"
  status = 301

[[redirects]]
  from = "/product/*"
  to = "/products/"
  status = 301

# Long cache for fingerprinted assets, fonts and video.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
